[project]
name = "racket-tracker"
version = "0.2.0"
authors = [
    {name = "Adam Pirog", email = "pirog.adam@gmail.com"},
]
description = "Keep track of your tennis gear!"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "flet>=1.0,<2",
    "SQLAlchemy>=2.0,<3"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9"
]

[project.urls]
homepage = "https://github.com/adampirog/racket-tracker"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["racket_tracker*"]
namespaces = false


[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.flet]
product = "Racket Tracker"
org = "com.adampirog"
bundle_id = "com.adampirog.rackettracker"
build_number = 2

[tool.flet.app]
path = "."
module = "main"
exclude=["tests"]

[tool.flet.android]
adaptive_icon_background = "#F8FAF8"